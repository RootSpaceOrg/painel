# Reserva: gera o instalador num Windows do GitHub e publica o release de uma tag que já existe.
# O caminho normal é `npm run release` (build local, com cache, bem mais rápido). Rode à mão: Actions → Release → Run workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente (ex.: v0.2.7)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Instalar
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Conferir versão da tag
        shell: bash
        working-directory: app
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Checks
        shell: bash
        working-directory: app
        run: |
          npm run check
          node scripts/util.check.ts
          cd src-tauri && cargo test
      - name: Gerar instalador
        working-directory: app
        run: npm run tauri build
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=$(ls app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          # se o release já existe (publicado à mão), só troca o instalador
          gh release create "$TAG" "$exe" --title "Painel $TAG" --generate-notes             || gh release upload "$TAG" "$exe" --clobber
