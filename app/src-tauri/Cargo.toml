[package]
name = "painel"
version = "0.1.0"
edition = "2021"

[lib]
name = "painel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "thin"
opt-level = 3
strip = true
codegen-units = 16
panic = "abort"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
getrandom = "0.4.3"
nvml-wrapper = "0.13.0"
rrule = "0.14.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.3"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tiny_http = "0.12.0"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Threading", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Variant", "Win32_System_Registry", "Win32_Media_KernelStreaming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
windows-core = "0.62"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
